<!--
  Vadestra workshop shell
  =======================
  One file, no build step, everything inline. The shell gives you the frame; every tab is written for the workshop.

  What the shell does (leave as is)
  - Header with the Vadestra wordmark, workshop title and subtitle.
  - Tab bar: one tab per step of the workshop, numbered, gold underline on the active tab. Arrow keys and the
    Previous / Next buttons move between tabs.
  - Edit / Present toggle. Present hides everything marked class="edit-only" and enlarges the type.
  - State in one object S, saved in the browser (localStorage) under the flow id. Menu: Save as file, Open file,
    Print summary, Reset.

  What you write per workshop (the two marked blocks below)
  1. script#ws-flow (JSON): meta (title, sub, lang, id), the shared item list, optional starting data per tab.
  2. TABS (JS, between the WORKSHOP TABS markers): one object per tab:
       id        unique, short, stable (data is saved under it)
       title     tab label
       crumb     optional small caps line above the heading (defaults to "Step n of N")
       lead      optional one-line intro under the heading
       render(d, el)   d = this tab's saved data object (mutate it freely), el = the page body. Return an HTML
                       string or write into el. Called again after every change.
       summary(d)      optional, returns an array of text lines for Print summary.
       actions         optional { name(d, button, event) } for buttons with data-act="name".

  Binding rules (no wiring needed)
  - <input|select|textarea data-bind="path"> reads and writes d[path]. Dotted paths work: "rows.2.score".
    type=number and data-num store numbers, checkboxes store true/false.
  - Text fields save while typing and redraw on change (blur or Enter). Add data-live to redraw on every keystroke.
  - <button data-act="name"> calls tab.actions.name(d, button, event), then saves and redraws.
  - Shared items (S.items) are visible to every tab: items(), itemsEditor(), and the helpers in "HELPERS".
-->

<script>
/* ===================== SHELL STRINGS ===================== */
const STR={
  en:{product:"Workshop",edit:"Edit",present:"Present",menu:"Menu",save:"Save as file",open:"Open file",print:"Print summary",
      reset:"Reset to start",resetConfirm:"Click again to reset",step:(n,N)=>`Step ${n} of ${N}`,prev:"Previous",next:"Next",
      loaded:"File opened",badFile:"Could not read the file",saved:"Saved",noTabs:"No tabs yet",name:"Name",group:"Group",
      add:"Add",remove:"Remove",summary:"Summary",pdf:"Export tab as PDF"},
  sv:{product:"Workshop",edit:"Redigera",present:"Presentera",menu:"Meny",save:"Spara som fil",open:"Öppna fil",print:"Skriv ut sammanfattning",
      reset:"Återställ till start",resetConfirm:"Klicka igen för att återställa",step:(n,N)=>`Steg ${n} av ${N}`,prev:"Föregående",next:"Nästa",
      loaded:"Filen är öppnad",badFile:"Kunde inte läsa filen",saved:"Sparat",noTabs:"Inga flikar än",name:"Namn",group:"Grupp",
      add:"Lägg till",remove:"Ta bort",summary:"Sammanfattning",pdf:"Exportera flik som PDF"}
};
const t=k=>(STR[S.meta.lang]||STR.en)[k];

/* ===================== HELPERS ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let seq=0;
const uid=p=>(p||"x")+Date.now().toString(36).slice(-4)+(seq++).toString(36)+Math.random().toString(36).slice(2,4);
const clone=o=>JSON.parse(JSON.stringify(o));
const locale=()=>S.meta.lang==="sv"?"sv-SE":"en-GB";
const fmt=(n,d)=>n==null||!isFinite(n)?"–":Number(n).toLocaleString(locale(),{minimumFractionDigits:d||0,maximumFractionDigits:d||0});
const pct=(n,d)=>n==null||!isFinite(n)?"–":fmt(n*100,d)+" %";
const items=group=>S.items.filter(i=>group==null||i.group===group);
const itemById=id=>S.items.find(i=>i.id===id);
const dataOf=tabId=>(S.data[tabId]=S.data[tabId]||{});          /* read another tab's data */
const pill=(text,tone)=>`<span class="pill ${tone||"mist"}">${esc(text)}</span>`;
const kpis=list=>`<div class="kpi-strip">${list.map(k=>`<div class="kpi-strip-item"><span class="kpi-strip-label">${esc(k.label)}</span><span class="kpi-strip-value">${k.value}${k.unit?` <small>${esc(k.unit)}</small>`:""}</span></div>`).join("")}</div>`;
const bar=(share,gold)=>`<div class="bar"><div class="bar-fill${gold?" gold":""}" style="width:${Math.max(0,Math.min(1,share||0))*100}%"></div></div>`;
/* 1..n rating buttons bound to d[path]; clicking the selected value clears it */
const scale=(path,value,n)=>`<span class="scale">${Array.from({length:n||5},(_,i)=>i+1).map(v=>`<button type="button" data-scale="${esc(path)}" data-v="${v}" class="${value===v?"on":""}">${v}</button>`).join("")}</span>`;
/* editor for the shared item list; put it in any tab: itemsEditor({groups:["A","B"]}) */
function itemsEditor(opt){
  opt=opt||{};
  const rows=S.items.map(i=>`<tr><td><input data-item="${i.id}" data-f="name" value="${esc(i.name)}" aria-label="${t("name")}"></td>
    ${opt.groups?`<td><select data-item="${i.id}" data-f="group">${opt.groups.map(g=>`<option${g===i.group?" selected":""}>${esc(g)}</option>`).join("")}</select></td>`:""}
    <td class="edit-only" style="width:1%"><button class="btn ghost small danger" data-item-del="${i.id}">${t("remove")}</button></td></tr>`).join("");

/* ---------- Storage: jsonbin.io (Route A), or a local demo store when the key is "demo" ---------- */
const JB="https://api.jsonbin.io/v3";
const MK_KEY="pp:master";              /* master key stays in this browser only, never in S, a file or a link */
const SYNC_MS=10000;                   /* facilitator sync interval, only while the poll is open and the tab is visible */
const mk=()=>lsGet(MK_KEY)||"";
const isDemo=k=>/^demo/.test(k||"");
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function jb(method,path,o){
  o=o||{};
  if(isDemo(o.master||o.access))return demoCall(method,path,o);
  const h={"Content-Type":"application/json"};
  if(o.master)h["X-Master-Key"]=o.master;
  if(o.access)h["X-Access-Key"]=o.access;
  Object.assign(h,o.headers||{});
  const r=await fetch(JB+path,{method,headers:h,body:o.body!=null?JSON.stringify(o.body):undefined,cache:"no-store"});
  let j=null;try{j=await r.json();}catch(e){}
  if(!r.ok)throw new Error((j&&j.message)||("Request failed ("+r.status+")"));
  return j;
}
const readBin=(id,o)=>jb("GET","/b/"+id+"/latest?meta=false",o);
const writeBin=(id,rec,o)=>jb("PUT","/b/"+id,Object.assign({body:rec},o));
async function createBin(name,rec,master){
  const j=await jb("POST","/b",{master,body:rec,headers:{"X-Bin-Private":"true","X-Bin-Name":name}});
  const id=j&&j.metadata&&j.metadata.id;
  if(!id)throw new Error("jsonbin returned no bin id. Poll not created.");
  return id;
}
function demoCall(method,path,o){
  return new Promise((res,rej)=>setTimeout(()=>{try{
    if(method==="POST"&&path==="/a")return res({accessKey:"demo-participant"});
    if(method==="POST"&&path==="/b"){const id="demo"+uid("b");lsSet("pp-demo:"+id,JSON.stringify(o.body));return res({record:o.body,metadata:{id}});}
    const m=path.match(/^\/b\/([^/?]+)/);if(!m)throw new Error("Unknown demo call");
    const k="pp-demo:"+m[1],cur=lsGet(k);if(cur==null)throw new Error("Poll data not found");
    if(method==="GET")return res(JSON.parse(cur));
    if(method==="PUT"){lsSet(k,JSON.stringify(o.body));return res({record:o.body});}
    if(method==="DELETE"){lsDel(k);return res({message:"Deleted"});}
    throw new Error("Unknown demo call");
  }catch(e){rej(e);}},120+Math.random()*300));
}

function tally(g){
  const P=pollData(),opts=included(g),count={};opts.forEach(o=>count[o.id]=0);

  voters.forEach(v=>(v.a||[]).forEach(id=>{if(id in count)count[id]++;}));

}

/* ===================== PARTICIPANT VIEW (URL ends in #poll=<control bin>,<vote bin>|<access key>) ===================== */
function b64u(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
function unb64u(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return decodeURIComponent(escape(atob(s)));}
/* The plain address is the phone view. The facilitator view opens only with ?admin (or #admin).
   Poll details travel in ?v=<control>.<votes>.<key in base64url>: scanners keep the query string and each poll gets a fresh address. */
const ADMIN=/(^|[?&])admin(=|&|$)/i.test(location.search.slice(1))||/^#admin$/i.test(location.hash);
const PM=(()=>{
  const parse=v=>{const m=(v||"").match(/^([A-Za-z0-9]+)\.([A-Za-z0-9]+)\.([A-Za-z0-9_-]+)$/);if(!m)return null;try{return {ctrl:m[1],bin:m[2],key:unb64u(m[3])};}catch(e){return null;}};
  let q=null;try{q=new URLSearchParams(location.search).get("v");}catch(e){}
  if(q!=null)return parse(q)||{bad:true};
  let h=location.hash||"";try{h=decodeURIComponent(h);}catch(e){}
  let m=h.match(/^#vote=(.+)$/);if(m)return parse(m[1])||{bad:true};
  m=h.match(/^#poll=([^,|]+),([^|]+)\|(.+)$/);if(m)return {ctrl:m[1],bin:m[2],key:m[3]};
  return ADMIN?null:{bad:true,none:true};
})();
const PART=!!PM;
const PS={ctrl:null,view:"loading",picks:[],err:"",busy:false};
const pOpts=g=>((PS.ctrl&&PS.ctrl.options)||[]).filter(o=>g==null||o.group===g);
const pMax=g=>Math.min(((PS.ctrl&&PS.ctrl.picks)||{})[g]||2,pOpts(g).length);
const pChosen=g=>PS.picks.filter(id=>pOpts(g).some(o=>o.id===id)).length;
const pComplete=()=>GKEYS.every(g=>pChosen(g)===pMax(g));
const pNoun=(g,n)=>n===1?GROUPS[g].one:GROUPS[g].many;
function voterId(){let v=lsGet("pp-voter");if(!v){v=uid("v")+Math.random().toString(36).slice(2,8);lsSet("pp-voter",v);}return v;}
function seeded(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
  return ()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return ((h^=h>>>16)>>>0)/4294967296;};}
function shuffled(arr,seed){const r=seeded(seed),a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function partBoot(){
  document.body.classList.add("participant");

  document.addEventListener("click",e=>{const b=e.target.closest("[data-pa]");if(!b||PS.busy)return;
    const a=b.dataset.pa;
    if(a==="pick"){const id=b.dataset.id,i=PS.picks.indexOf(id),o=pOpts().find(x=>x.id===id);if(!o)return;const g=o.group,max=pMax(g);
      if(i>=0)PS.picks.splice(i,1);else if(pChosen(g)<max)PS.picks.push(id);else{toast(`You can pick ${max} ${pNoun(g,max)}. Remove one first.`);return;}
      lsSet(draftKey(),JSON.stringify(PS.picks));rp();}
    if(a==="submit")partSubmit();
    if(a==="reload")partLoad();
    if(a==="change"){PS.view="vote";rp();}
  });
  partLoad();
}
const P_CTRL=PM&&PM.ctrl,P_BIN=PM&&PM.bin,P_KEY=(PM&&PM.key)||"";
const draftKey=()=>"pp-draft:"+P_BIN+":"+((PS.ctrl&&PS.ctrl.round)||1);
const sentKey=()=>"pp-sent:"+P_BIN+":"+((PS.ctrl&&PS.ctrl.round)||1);
async function partLoad(){
  if(PM.bad){PS.view="nolink";rp();return;}
  PS.view="loading";PS.err="";rp();

    PS.view=!PS.ctrl.open?(lsGet(sentKey())?"done":"waiting"):lsGet(sentKey())?"done":"vote";
  }catch(e){PS.view="error";PS.err=e.message||String(e);}

/* Write my vote with read, write, verify. Up to 6 attempts with a growing random back-off. */
async function writeMyVote(ans){
  const me=voterId();
  for(let i=0;i<6;i++){
    const rec=await readBin(P_BIN,{access:P_KEY})||{};
    rec.votes=rec.votes||{};rec.votes[me]={a:ans,t:Date.now()};
    await writeBin(P_BIN,rec,{access:P_KEY});
    const chk=await readBin(P_BIN,{access:P_KEY});                   /* verify the vote landed */
    const mine=chk&&chk.votes&&chk.votes[me];
    if(mine&&JSON.stringify(mine.a)===JSON.stringify(ans))return true;
    await sleep((400+Math.random()*1200)*(i+1));                       /* someone else wrote at the same time */
  }
  return false;
}
/* A later write from another phone can still erase a confirmed vote. Re-check twice and repair silently. */
let healT=[];
function scheduleHeal(ans){
  healT.forEach(clearTimeout);
  healT=[5000,15000].map(ms=>setTimeout(async()=>{
    try{
      const c=await readBin(P_CTRL,{access:P_KEY});if(!c.open)return;
      const chk=await readBin(P_BIN,{access:P_KEY});const mine=chk&&chk.votes&&chk.votes[voterId()];
      if(!mine||JSON.stringify(mine.a)!==JSON.stringify(ans))await writeMyVote(ans);
    }catch(e){}
  },ms+Math.random()*2000));
}
async function partSubmit(){
  if(!pComplete())return;
  PS.busy=true;PS.err="";rp();
  try{
    const c=await readBin(P_CTRL,{access:P_KEY});PS.ctrl=c;
    if(!c.open){PS.view="waiting";PS.err="The poll is closed.";return;}
    const ans=PS.picks.slice();
    if(!await writeMyVote(ans))throw new Error("Your vote did not save. Tap Send vote again.");
    lsSet(sentKey(),String(Date.now()));PS.view="done";scheduleHeal(ans);
  }catch(e){PS.err=e.message||String(e);}
  finally{PS.busy=false;rp();}
}
function rp(){
  const page=$("#page"),c=PS.ctrl;
  const err=PS.err?`<div class="hint err">${esc(PS.err)}</div>`:"";
  let h="";
  if(PS.view==="loading")h=`<div class="empty">Loading</div>`;
  else if(PS.view==="nolink")h=`<div class="card p-msg"><h2>${PM.none?"Scan the QR code to vote":"This link is incomplete"}</h2><p class="muted">${PM.none?"Use the code on the screen in the room.":"Scan the code on the screen again."}</p></div>`;
  else if(PS.view==="error")h=`${err}<div class="card p-msg"><h2>Could not load the poll</h2><p class="muted">Check your connection and try again.</p><button class="btn primary" data-pa="reload">Try again</button></div>`;
  else if(PS.view==="waiting")h=`${err}<div class="card p-msg"><h2>${lsGet(sentKey())?"Thanks for voting":"The poll is not open"}</h2><p class="muted">Wait for the facilitator, then tap below.</p><button class="btn primary" data-pa="reload">Check again</button></div>`;
  else if(PS.view==="done")h=c&&!c.open
    ?`<div class="card p-msg"><h2>Thanks, your vote is in</h2><p class="muted">The poll is closed.</p><button class="btn ghost" data-pa="reload">Refresh</button></div>`
    :`<div class="card p-msg"><h2>Thanks, your vote is in</h2><p class="muted">You can change it while the poll is open.</p><div class="row" style="justify-content:center"><button class="btn" data-pa="change">Change my vote</button><button class="btn ghost" data-pa="reload">Refresh</button></div></div>`;
  else{
    /* order differs per phone to avoid position bias */
    const sec=g=>{const opts=shuffled(pOpts(g),voterId()+P_BIN+g),max=pMax(g),n=pChosen(g);if(!opts.length)return "";
      return `<div class="p-sec"><div class="p-lead"><span>Pick your favourite ${max} ${pNoun(g,max)}</span><span class="p-count${n===max?" ok":""}">${n} of ${max}</span></div>
        ${opts.map(o=>{const on=PS.picks.includes(o.id);return `<button class="p-opt${on?" on":""}" data-pa="pick" data-id="${esc(o.id)}" aria-pressed="${on}">
          <span class="p-check">${on?"✓":""}</span><span class="p-text"><span class="${g==="tagline"?"p-tag":"p-ptext"}">${esc(o.text||"Option "+o.code)}</span></span></button>`;}).join("")}</div>`;};
    const need=GKEYS.filter(g=>pChosen(g)!==pMax(g));
    h=`${err}${GKEYS.map(sec).join("")}
      <div class="p-submit"><span class="muted small">${need.length?"Pick your "+need.map(g=>GROUPS[g].many).join(" and ")+" to send":"Ready to send"}</span>
        <button class="btn primary" data-pa="submit"${need.length||PS.busy?" disabled":""}>${PS.busy?"Sending":"Send vote"}</button></div>`;
  }
  page.innerHTML=`<div class="p-wrap">${h}</div>`;
}

/* ===================== PDF export of the current tab ===================== */
async function exportPdf(){
  const page=$("#page");
  if(!window.html2canvas||!window.jspdf){window.print();return;}
  toast("Preparing PDF");
  const canvas=await html2canvas(page,{scale:2,backgroundColor:"#f5f5f3",
    ignoreElements:el=>el.classList&&(el.classList.contains("pager")||el.classList.contains("edit-only")||el.classList.contains("no-pdf"))});
  const pdf=new window.jspdf.jsPDF({orientation:"landscape",unit:"pt",format:"a4"});
  const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),m=28,w=pw-2*m,ratio=w/canvas.width,slice=Math.floor((ph-2*m)/ratio);
  for(let y=0,p=0;y<canvas.height;y+=slice,p++){
    const c=document.createElement("canvas");c.width=canvas.width;c.height=Math.min(slice,canvas.height-y);
    c.getContext("2d").drawImage(canvas,0,-y);if(p)pdf.addPage();pdf.addImage(c.toDataURL("image/png"),"PNG",m,m,w,c.height*ratio);
  }
  pdf.save(`${(activeTab().title||"tab").toLowerCase()}_${new Date().toISOString().slice(0,10)}.pdf`);
}
function postRender(page){
  page.querySelectorAll("[data-qr]").forEach(el=>{
    if(window.QRCode){el.innerHTML="";new QRCode(el,{text:el.dataset.qr,width:240,height:240,correctLevel:QRCode.CorrectLevel.M});}
    else el.innerHTML=`<p class="small muted" style="word-break:break-all">${esc(el.dataset.qr)}</p>`;
  });
}


/* ===================== STATE ===================== */
const FLOW=(()=>{try{return JSON.parse($("#ws-flow").textContent||"{}");}catch(e){return {};}})();
function fresh(){return {v:1,id:FLOW.id||"ws",meta:Object.assign({title:"",sub:"",lang:"en"},FLOW.meta||{}),
  items:clone(FLOW.items||[]).map(i=>Object.assign({id:uid("i"),name:"",group:""},i)),data:clone(FLOW.data||{}),
  active:TABS[0]&&TABS[0].id,present:false};}
const KEY="ws:"+(FLOW.id||"ws");
let S=(()=>{try{const s=JSON.parse(lsGet(KEY));if(s&&s.id===(FLOW.id||"ws"))return s;}catch(e){}return fresh();})();
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>lsSet(KEY,JSON.stringify(S)),150);}
const activeTab=()=>TABS.find(x=>x.id===S.active)||TABS[0];

/* ===================== RENDER ===================== */
function renderChrome(){
  document.documentElement.lang=S.meta.lang;
  document.title=S.meta.title||"Workshop";
  document.body.classList.toggle("present",!!S.present);
  $("#product").textContent=t("product");
  $("#metaTitle").value=S.meta.title;$("#metaSub").value=S.meta.sub;
  $("#modeBtn").textContent=S.present?t("edit"):t("present");
  $("#modeBtn").classList.toggle("on",!!S.present);
  $("#menuBtn").textContent=t("menu");
  document.querySelectorAll("[data-menu]").forEach(b=>b.textContent=t(b.dataset.menu));
  $("#tabs").innerHTML=TABS.map((x,i)=>`<button class="tab${x===activeTab()?" on":""}" role="tab" aria-selected="${x===activeTab()}" data-tab="${x.id}"><span class="n">${String(i+1).padStart(2,"0")}</span>${esc(x.title)}</button>`).join("");
}
function renderPage(){
  const page=$("#page"),tb=activeTab();
  if(!tb){page.innerHTML=`<div class="empty">${t("noTabs")}</div>`;return;}
  const f=document.activeElement,key=f&&(f.dataset.bind||f.dataset.f&&f.dataset.item+"."+f.dataset.f),pos=f&&f.selectionStart;
  const i=TABS.indexOf(tb),N=TABS.length,d=dataOf(tb.id);
  const body=document.createElement("div");
  const out=tb.render(d,body);
  if(typeof out==="string")body.innerHTML=out;
  page.innerHTML=`<div class="page-head"><div><p class="crumb label-caps">${esc(tb.crumb||t("step")(i+1,N))}</p><h1>${esc(tb.title)}</h1>${tb.lead?`<p class="lead">${esc(tb.lead)}</p>`:""}</div><div id="headRight"></div></div>`;
  page.appendChild(body);
  postRender(body);
  page.insertAdjacentHTML("beforeend",`<div class="pager"><button class="btn" data-go="-1"${i===0?" disabled":""}>← ${t("prev")}</button><button class="btn primary" data-go="1"${i===N-1?" disabled":""}>${t("next")} →</button></div>`);
  if(key){const el=page.querySelector(`[data-bind="${CSS.escape(key)}"]`)||(()=>{const [id,fl]=key.split(".");return page.querySelector(`[data-item="${CSS.escape(id)}"][data-f="${fl}"]`);})();
    if(el){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos);}catch(e){}}}
}
function render(){renderChrome();renderPage();}

/* ===================== EVENTS ===================== */
function readValue(el){
  if(el.type==="checkbox")return el.checked;
  if(el.type==="number"||el.type==="range"||"num" in el.dataset){const v=String(el.value).replace(",",".").replace(/\s/g,"");return v===""||isNaN(Number(v))?null:Number(v);}
  return el.value;
}
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="metaTitle"||el.id==="metaSub"){S.meta[el.id==="metaTitle"?"title":"sub"]=el.value;document.title=S.meta.title||"Workshop";save();return;}
  if(el.dataset.item){const it=itemById(el.dataset.item);if(it){it[el.dataset.f]=el.value;save();}if(el.tagName==="SELECT")renderPage();return;}
  if(el.dataset.bind){setPath(dataOf(S.active),el.dataset.bind,readValue(el));save();
    if("live" in el.dataset||el.tagName==="SELECT"||el.type==="checkbox"||el.type==="range")renderPage();}
});
document.addEventListener("change",e=>{const el=e.target;if((el.dataset.bind||el.dataset.item)&&el.tagName!=="SELECT"&&el.type!=="checkbox"&&el.type!=="range")renderPage();});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.tagName==="INPUT"&&(e.target.dataset.bind||e.target.dataset.item))e.target.blur();
  if(PART||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1);
  if(e.key==="Escape")$("#menuPop").hidden=true;
});
function go(n){const i=TABS.indexOf(activeTab()),j=Math.max(0,Math.min(TABS.length-1,i+n));if(j!==i){S.active=TABS[j].id;save();render();window.scrollTo(0,0);}}
let resetArmed=false;
document.addEventListener("click",e=>{
  const b=e.target.closest("button");
  if(!e.target.closest(".menu"))$("#menuPop").hidden=true;
  if(!b)return;
  if(b.dataset.tab){S.active=b.dataset.tab;save();render();return;}
  if(b.dataset.go){go(Number(b.dataset.go));return;}
  if(b.id==="modeBtn"){S.present=!S.present;save();render();return;}
  if(b.id==="menuBtn"){$("#menuPop").hidden=!$("#menuPop").hidden;return;}
  if(b.dataset.menu)return menu(b.dataset.menu,b);
  if(b.dataset.scale){const d=dataOf(S.active),v=Number(b.dataset.v);setPath(d,b.dataset.scale,getPath(d,b.dataset.scale)===v?null:v);save();renderPage();return;}
  if("itemAdd" in b.dataset){S.items.push({id:uid("i"),name:"",group:b.dataset.itemAdd});save();renderPage();const ins=document.querySelectorAll("[data-f=name]");ins.length&&ins[ins.length-1].focus();return;}
  if(b.dataset.itemDel){S.items=S.items.filter(i=>i.id!==b.dataset.itemDel);save();renderPage();return;}
  if(b.dataset.act){const tb=activeTab(),fn=tb.actions&&tb.actions[b.dataset.act];if(fn){fn(dataOf(tb.id),b,e);save();renderPage();}}
});
function menu(a,b){
  if(a==="save"){const n=(S.meta.title||"workshop").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"workshop";
    const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}),l=document.createElement("a");
    l.href=URL.createObjectURL(blob);l.download=`${n}_${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(l);l.click();setTimeout(()=>{URL.revokeObjectURL(l.href);l.remove();},400);toast(t("saved"));}
  if(a==="open")$("#fileIn").click();
  if(a==="pdf"){$("#menuPop").hidden=true;exportPdf();}
  if(a==="print"){$("#print").innerHTML=`<h1>${esc(S.meta.title)}</h1><p class="muted">${esc(S.meta.sub)}</p>`+TABS.map(x=>{const l=x.summary?x.summary(dataOf(x.id)):[];return l.length?`<h2>${esc(x.title)}</h2>${l.map(r=>`<p>${esc(r)}</p>`).join("")}`:"";}).join("");$("#menuPop").hidden=true;window.print();}
  if(a==="reset"){if(!resetArmed){resetArmed=true;b.textContent=t("resetConfirm");setTimeout(()=>{resetArmed=false;b.textContent=t("reset");},2800);return;}
    lsDel(KEY);S=fresh();resetArmed=false;$("#menuPop").hidden=true;render();}
  if(a!=="reset")$("#menuPop").hidden=true;
}
$("#fileIn").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!o.meta||!Array.isArray(o.items))throw 0;S=Object.assign(fresh(),o);save();render();toast(t("loaded"));}catch(err){toast(t("badFile"));}};
  r.readAsText(f);e.target.value="";});

if(PART)partBoot();else{render();scheduleSync();}
</script>
